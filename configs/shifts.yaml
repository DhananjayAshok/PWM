# Deployment-shift suite (pwm/shifts, plans/shifts.md). Levels L1..L5 were screened on `screening_robot` (minor but
# noticeable -> policy-breaking) and are translated to the other robots by pwm/shifts/registry.py:translate
# (same physical units; latency in ms -> whole control steps; payload as the same fraction of rated payload).
shifts:
  screening_robot: franka_libero
  robot_facts:
    franka_libero: {control_hz: 20, position_action_scale_m: 0.05, payload_kg: 3.0}   # Panda rated payload 3 kg
    gr1_robocasa: {control_hz: 20, position_action_scale_m: null, payload_kg: 3.0}    # assumed per-arm payload
    widowx_bridge: {control_hz: 5, position_action_scale_m: 1.0, payload_kg: 0.25}    # WidowX 250 rated 250 g
    google_fractal: {control_hz: 3, position_action_scale_m: 1.0, payload_kg: 1.0}    # assumed (no public spec)
  suite:
    # ---------------- G: robot-agnostic (camera, light, scene)
    camera_orientation:  # degrees about the camera's pan + tilt diagonal
      family: G
      unit: deg
      candidates: [2, 4, 6, 8, 10, 14, 18, 24]
      levels: [4, 10, 14, 18, 24]  # provisional (n=12 per value, 2026-10-25)
    camera_fov:  # degrees added to the vertical field of view
      family: G
      unit: deg
      candidates: [3, 6, 9, 12, 16, 20, 25]
      levels: [3, 6, 12, 20, 25]  # provisional (n=12 per value, 2026-10-25)
    camera_shift:  # cm right (+ half that up), camera frame
      family: G
      unit: cm
      candidates: [1, 2, 3, 5, 7, 10, 14]
      extension_candidates: [20, 28]  # second screening round (first round too weak or saturated)
      levels: [2, 5, 7, 10, 14]  # provisional (n=12 per value, 2026-10-25)
    light_flicker:  # [relative amplitude, Hz]
      family: G
      unit: "[amplitude, Hz]"
      candidates: [[0.1, 1], [0.2, 1], [0.3, 1], [0.5, 1], [0.7, 1], [0.9, 1], [0.9, 3]]
      extension_candidates: [[1.0, 1], [1.0, 3], [1.0, 6]]  # second screening round (first round too weak or saturated)
      levels: [[0.1, 1], [0.3, 1], [0.5, 1], [0.7, 1], [0.9, 3]]  # provisional (n=12 per value, 2026-10-25)
    shadows:  # shadows on + lights tilted by this many degrees (longer shadows)
      family: G
      unit: deg
      candidates: [0, 10, 20, 30, 45, 60, 75]
      extension_candidates: [2, 4, 6, 8, 13, 16]  # second screening round (first round too weak or saturated)
      levels: [10, 20, 45, 60, 75]  # provisional (n=12 per value, 2026-10-25)
    colour_temperature:  # warm cast w: light colour x (1+w, 1+w/3, 1-w)
      family: G
      unit: w
      candidates: [0.1, 0.2, 0.3, 0.45, 0.6, 0.8, 1.0]
      levels: [0.2, 0.45, 0.6, 0.8, 1.0]  # provisional (n=12 per value, 2026-10-25)
    light_direction:  # degrees, all lights rotated about the world y axis
      family: G
      unit: deg
      candidates: [10, 20, 30, 45, 60, 75, 90]
      extension_candidates: [2, 4, 6, 8, 13, 16]  # second screening round (first round too weak or saturated)
      levels: [20, 45, 60, 75, 90]  # provisional (n=12 per value, 2026-10-25)
    surface_texture:  # work-surface texture blended towards a high-contrast checker (0..1)
      family: G
      unit: alpha
      candidates: [0.15, 0.3, 0.45, 0.6, 0.75, 0.9, 1.0]
      levels: [0.15, 0.3, 0.6, 0.9, 1.0]  # provisional (n=12 per value, 2026-10-25)
    table_colour:  # work-surface colour tinted towards dark green (0..1)
      family: G
      unit: strength
      candidates: [0.15, 0.3, 0.45, 0.6, 0.75, 0.9, 1.0]
      levels: [0.15, 0.3, 0.6, 0.9, 1.0]  # provisional (n=12 per value, 2026-10-25)
    table_height:  # cm, table raised relative to robot and camera
      family: G
      unit: cm
      candidates: [1, 2, 3, 4, 6, 8, 10]
      levels: [2, 4, 6, 8, 10]  # provisional (n=12 per value, 2026-10-25)
    distractors:  # number of extra objects
      family: G
      unit: objects
      candidates: [1, 2, 3, 4, 5, 6, 7]
      levels: [1, 3, 4, 5, 7]  # provisional (n=12 per value, 2026-10-25)
    # ---------------- C: end-effector delta-controlled arms (some also apply to the joint-controlled GR-1)
    control_frequency:  # commands executed at this multiple of the trained control rate
      family: C
      unit: x rate
      candidates: [0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3]
      levels: [0.8, 0.6, 0.5, 0.4, 0.3]  # provisional (n=12 per value, 2026-10-25)
    latency_jitter:  # ms, maximum of a bounded random-walk delay
      family: C
      unit: ms
      candidates: [50, 100, 150, 200, 300, 400, 600]
      extension_candidates: [900, 1200, 1800]  # second screening round (first round too weak or saturated)
      levels: [100, 200, 300, 400, 600]  # provisional (n=12 per value, 2026-10-25)
    latency:  # ms, fixed delay (whole control steps)
      family: C
      unit: ms
      candidates: [50, 100, 150, 200, 300, 400, 600]
      levels: [100, 150, 200, 300, 600]  # provisional (n=12 per value, 2026-10-25)
    frame_rotation:  # degrees, commanded xy translation rotated about z
      family: C
      unit: deg
      candidates: [5, 10, 15, 20, 30, 45, 60]
      levels: [10, 15, 20, 30, 45]  # provisional (n=12 per value, 2026-10-25)
      unsupported: {gr1_robocasa: "joint-position control (29-D absolute targets): no end-effector command frame"}
    base_pose:  # [cm along the base diagonal, deg of yaw]
      family: C
      unit: "[cm, deg]"
      candidates: [[1, 2], [2, 4], [3, 5], [4, 8], [6, 10], [8, 15], [12, 20]]
      levels: [[1, 2], [4, 8], [6, 10], [8, 15], [12, 20]]  # provisional (n=12 per value, 2026-10-25)
    payload:  # kg of uncompensated load at the hand (other robots: same fraction of rated payload)
      family: C
      unit: kg
      candidates: [0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0]
      extension_candidates: [0.05, 0.1, 0.15]  # second screening round (first round too weak or saturated)
      levels: [0.25, 0.5, 1.0, 2.0, 3.0]  # provisional (n=12 per value, 2026-10-25)
