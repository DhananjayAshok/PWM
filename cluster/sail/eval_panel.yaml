# Eval panel for one world model and robot (scripts/jobs/eval_panel.sh) on one B300.
#   bash cluster/sail/launch.sh cluster/sail/eval_panel.yaml pwm-panel-<model>-<robot> --env MODEL=<model> --env ROBOT=<robot> --env TAG=best
name: pwm-eval-panel

resources:
  infra: k8s/pantheon
  accelerators: B300:1
  cpus: 22
  memory: 250
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 2}  # restart-safe: finished datasets are skipped

workdir: .

volumes:
  /persist: ${cluster_volume}

envs:
  PANTHEON_USER: ${cluster_user}
  MODEL: ""
  ROBOT: ""
  TAG: best
  DATASETS: all
  OMP_NUM_THREADS: "22"
  NVIDIA_DRIVER_CAPABILITIES: all
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

config:
  kubernetes:
    pod_config:
      metadata:
        labels:
          telemetry-contract: opt-out
          telemetry-opt-out-reason: world-model-eval

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/eval_panel.sh --model "$MODEL" --robot "$ROBOT" --tag "$TAG" --datasets "$DATASETS"
  status=$?
  # Jobs on this cluster can stay RUNNING after the script ends if a child outlives it: end leftovers explicitly.
  pkill -9 -f "/tmp/pwm_env[s]/" 2>/dev/null
  echo "ALL DONE (status $status)"
  exit $status
