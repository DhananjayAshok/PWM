# Predictions (or real-frame features) of a trained DreamerV3 world model (scripts/jobs/eval_dreamerv3.sh) on one B300.
#   bash cluster/sail/launch.sh cluster/sail/eval_dreamerv3.yaml dv3-eval-<robot>-<set> \
#       --env ROBOT=<robot> [--env MODE=encode] [--env DATASET=...] [--env EXTRA_ARGS="--split calib"]
name: pwm-eval-dreamerv3

resources:
  infra: k8s/pantheon
  accelerators: B300:1
  cpus: 22
  memory: 250
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 2}  # restart-safe: finished clips are skipped

workdir: .

volumes:
  /persist: ${cluster_volume}

envs:
  PANTHEON_USER: ${cluster_user}
  ROBOT: ""
  MODE: predict
  DATASET: nominal
  EXTRA_ARGS: ""
  OMP_NUM_THREADS: "22"
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

config:
  kubernetes:
    pod_config:
      metadata:
        labels:
          telemetry-contract: opt-out
          telemetry-opt-out-reason: world-model-eval

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/eval_dreamerv3.sh --robot "$ROBOT" --mode "$MODE" --dataset "$DATASET" $EXTRA_ARGS
  status=$?
  pkill -9 -f "/tmp/pwm_env[s]/" 2>/dev/null
  echo "ALL DONE (status $status)"
  exit $status
