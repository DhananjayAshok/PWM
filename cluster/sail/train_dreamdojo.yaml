# Fine-tune DreamDojo 2B on one robot (scripts/jobs/train_dreamdojo.sh), one whole node by default. Restart-safe:
# evictions resume from the newest checkpoint in /checkpoints; a finished run (STOPPED) exits at once.
#   bash cluster/sail/launch.sh cluster/sail/train_dreamdojo.yaml dd-<robot>-nominal --env ROBOT=<robot> \
#       --env EXPERIMENT_TAG=dd-<robot>-nominal --env WANDB_RUN_ID=dd-<robot>-nominal
#   fewer GPUs: add --gpus B300:2 --cpus 44 --memory 500 (22 CPUs / 250 GB per GPU)
name: pwm-train-dreamdojo

resources:
  infra: k8s/pantheon
  accelerators: B300:8
  cpus: 176
  memory: 2000
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 3}

workdir: .

volumes:
  /persist: ${cluster_volume}
  /checkpoints: checkpoints-sail

envs:
  PANTHEON_USER: ${cluster_user}
  ROBOT: ""
  DATASET: nominal
  EXPERIMENT_TAG: ""
  WANDB_RUN_ID: ""
  WANDB_RESUME: allow
  EXTRA_ARGS: ""            # e.g. "--max_steps 300" for a smoke test
  OMP_NUM_THREADS: "22"
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

secrets:
  - secrets:WANDB_API_KEY

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/train_dreamdojo.sh --robot "$ROBOT" --dataset "$DATASET" \
      --run_dir "/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG" $EXTRA_ARGS
  status=$?
  # marker for the reaper: the run has finished (its STOPPED file exists)
  [ -f "/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG/STOPPED" ] && echo "STOPPED $EXPERIMENT_TAG"
  # Jobs on this cluster can stay RUNNING after the script ends if a child outlives it: end leftovers explicitly.
  # leftover workers (pattern escaped so it never matches this script's own text)
  pkill -9 -f "pwm\.wm\.dreamdojo\.(train|predict)" 2>/dev/null
  echo "ALL DONE (status $status)"
  exit $status
