# Fine-tune V-JEPA 2-AC on one robot (scripts/jobs/train_vjepa2.sh), on all GPUs of the job (default 1; for more pass
# e.g. --gpus B300:4 --cpus 88 --memory 1000 to launch.sh). Restart-safe: evictions and crashes resume from the newest
# checkpoint; a finished run (STOPPED.json) exits at once.
#   bash cluster/sail/launch.sh cluster/sail/train_vjepa2.yaml vj2-<robot>-nominal --env ROBOT=<robot> \
#       --env EXPERIMENT_TAG=vj2-<robot>-nominal --env WANDB_RUN_ID=vj2-<robot>-nominal [--priority p2]
# Checkpoints: <storage_dir>/checkpoints/vjepa2/<robot>/<dataset>/ on /persist (the dev box and the panel read them).
name: pwm-train-vjepa2

resources:
  infra: k8s/pantheon
  accelerators: B300:1
  cpus: 22
  memory: 250
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 3}

workdir: .

volumes:
  /persist: ${cluster_volume}

envs:
  PANTHEON_USER: ${cluster_user}
  ROBOT: ""
  DATASET: nominal
  EXPERIMENT_TAG: ""
  WANDB_RUN_ID: ""
  WANDB_RESUME: allow
  OMP_NUM_THREADS: "8"
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

secrets:
  - secrets:WANDB_API_KEY

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/train_vjepa2.sh --robot "$ROBOT" --dataset "$DATASET"
  status=$?
  # Jobs on this cluster can stay RUNNING after the script ends if a child outlives it: end leftovers explicitly.
  pkill -9 -f "/tmp/pwm_env[s]/" 2>/dev/null
  echo "ALL DONE (status $status)"
  exit $status
