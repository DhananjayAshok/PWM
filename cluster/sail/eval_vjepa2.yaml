# V-JEPA 2-AC predictions / real-frame features for one robot and dataset split (scripts/jobs/eval_vjepa2.sh), one
# process per GPU. Restart-safe (finished episodes are skipped).
#   bash cluster/sail/launch.sh cluster/sail/eval_vjepa2.yaml vj2-pred-<robot>-<dataset> --env ROBOT=<robot> \
#       --env DATASET=<dataset> --env MODE=predict --env CHECKPOINT=/checkpoints/<user>/<run>/best.pt [--env SPLIT=test]
name: pwm-eval-vjepa2

resources:
  infra: k8s/pantheon
  accelerators: B300:1
  cpus: 22
  memory: 250
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 3}

workdir: .

volumes:
  /persist: ${cluster_volume}
  /checkpoints: checkpoints-sail

envs:
  PANTHEON_USER: ${cluster_user}
  ROBOT: ""
  DATASET: ""
  MODE: predict
  SPLIT: test
  CHECKPOINT: none
  MAX_EPISODES: "0"
  OMP_NUM_THREADS: "8"
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

config:
  kubernetes:
    pod_config:
      metadata:
        labels:
          telemetry-contract: opt-out
          telemetry-opt-out-reason: wm-inference

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/eval_vjepa2.sh --robot "$ROBOT" --dataset "$DATASET" --mode "$MODE" --split "$SPLIT" \
      --checkpoint "$CHECKPOINT" --max_episodes "$MAX_EPISODES"
  status=$?
  pkill -9 -f "/tmp/pwm_env[s]/" 2>/dev/null
  echo "ALL DONE (status $status)"
  exit $status
