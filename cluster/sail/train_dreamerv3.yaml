# Train DreamerV3's world model on one robot (scripts/jobs/train_dreamerv3.sh) on one B300. Restart-safe: evictions and
# crashes resume from the newest checkpoint in /checkpoints; a finished run exits at once.
#   bash cluster/sail/launch.sh cluster/sail/train_dreamerv3.yaml dv3-<robot>-nominal \
#       --env ROBOT=<robot> --env EXPERIMENT_TAG=dv3-<robot>-nominal --env WANDB_RUN_ID=dv3-<robot>-nominal [--priority p2]
name: pwm-train-dreamerv3

resources:
  infra: k8s/pantheon
  accelerators: B300:1
  cpus: 22
  memory: 250
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 3}

workdir: .

volumes:
  /persist: ${cluster_volume}
  /checkpoints: checkpoints-sail

envs:
  PANTHEON_USER: ${cluster_user}
  ROBOT: ""
  DATASET: nominal
  OVERRIDES: none                # e.g. size=large
  EXPERIMENT_TAG: ""
  WANDB_RUN_ID: ""
  WANDB_RESUME: allow
  OMP_NUM_THREADS: "22"
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

secrets:
  - secrets:WANDB_API_KEY

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/train_dreamerv3.sh --robot "$ROBOT" --dataset "$DATASET" --run_name "$EXPERIMENT_TAG" \
      --ckpt_dir "/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG" --overrides "$OVERRIDES"
  status=$?
  # Jobs on this cluster can stay RUNNING after the script ends if a child outlives it: end leftovers explicitly.
  pkill -9 -f "/tmp/pwm_env[s]/" 2>/dev/null
  echo "ALL DONE (status $status)"
  exit $status
