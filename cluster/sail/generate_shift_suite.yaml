# Shift test sets + calibration pools, all levels of one robot x shift (scripts/jobs/generate_shift_suite.sh). Restart-safe.
#   bash cluster/sail/launch.sh cluster/sail/generate_shift_suite.yaml pwm-gensh-<robot>-<shift> --env ROBOT=<robot> --env SHIFT=<shift>
name: pwm-generate-shift-suite

resources:
  infra: k8s/pantheon
  accelerators: B300:1
  cpus: 22
  memory: 250
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 3}

workdir: .

volumes:
  /persist: ${cluster_volume}

envs:
  PANTHEON_USER: ${cluster_user}
  ROBOT: ""
  SHIFT: ""
  GROUPS_PER_TASK: "1"
  CALIB_UNITS: "50"
  WORKERS: "8"
  EXTRA_ARGS: ""
  OMP_NUM_THREADS: "2"
  NVIDIA_DRIVER_CAPABILITIES: all
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

config:
  kubernetes:
    pod_config:
      metadata:
        labels:
          telemetry-contract: opt-out
          telemetry-opt-out-reason: sim-data-generation

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/generate_shift_suite.sh --robot "$ROBOT" --shift "$SHIFT" --groups_per_task "$GROUPS_PER_TASK" --calib_units "$CALIB_UNITS" --workers "$WORKERS" $EXTRA_ARGS
  status=$?
  echo "ALL DONE (status $status)"   # end marker for cluster/sail/reaper.sh
  pkill -9 -f "/tmp/pwm_env[s]/" 2>/dev/null
  exit $status
