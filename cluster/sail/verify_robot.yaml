# Step-1 acceptance for one robot (scripts/jobs/verify_robot.sh) on one B300.
#   bash cluster/sail/launch.sh cluster/sail/verify_robot.yaml pwm-verify-<robot> --env ROBOT=<robot>
name: pwm-verify-robot

resources:
  infra: k8s/pantheon
  accelerators: B300:1
  cpus: 22
  memory: 250
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 2}  # restart-safe: finished episodes are kept

workdir: .

volumes:
  /persist: ${cluster_volume}

envs:
  PANTHEON_USER: ${cluster_user}
  ROBOT: ""
  EXTRA_ARGS: ""                 # e.g. "--episodes 4" for a smoke test
  OMP_NUM_THREADS: "22"
  NVIDIA_DRIVER_CAPABILITIES: all
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

config:
  kubernetes:
    pod_config:
      metadata:
        labels:
          telemetry-contract: opt-out
          telemetry-opt-out-reason: sim-policy-eval

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/verify_robot.sh --robot "$ROBOT" $EXTRA_ARGS
  status=$?
  # Jobs on this cluster can stay RUNNING after the script ends if a child outlives it: end leftovers explicitly.
  pkill -9 -f "/tmp/pwm_env[s]/" 2>/dev/null
  echo "ALL DONE (status $status)"
  exit $status
