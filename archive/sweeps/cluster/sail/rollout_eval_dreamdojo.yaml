# Rollout evaluation of a DreamDojo run (scripts/jobs/rollout_eval_dreamdojo.sh). Restart-safe (per-episode results).
#   bash cluster/sail/launch.sh cluster/sail/rollout_eval_dreamdojo.yaml dd-reval-<run tag> --env ROBOT=<robot> \
#       --env RUN_TAG=<run tag> [--gpus B300:N --cpus .. --memory ..]
name: pwm-rollout-eval-dreamdojo

resources:
  infra: k8s/pantheon
  accelerators: B300:1
  cpus: 22
  memory: 250
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 3}

workdir: .

volumes:
  /persist: ${cluster_volume}
  /checkpoints: checkpoints-sail

envs:
  PANTHEON_USER: ${cluster_user}
  ROBOT: ""
  RUN_TAG: ""
  OMP_NUM_THREADS: "22"
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

config:
  kubernetes:
    pod_config:
      metadata:
        labels:
          telemetry-contract: opt-out
          telemetry-opt-out-reason: world-model-eval

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/rollout_eval_dreamdojo.sh --robot "$ROBOT" --run_dir "/checkpoints/$PANTHEON_USER/$RUN_TAG"
  status=$?
  [ $status -eq 0 ] && echo "STOPPED rollout eval $RUN_TAG"  # marker for the reaper
  pkill -9 -f "pwm\.wm\.dreamdojo\.(rollout_eval|predict)" 2>/dev/null
  echo "ALL DONE (status $status)"
  exit $status
