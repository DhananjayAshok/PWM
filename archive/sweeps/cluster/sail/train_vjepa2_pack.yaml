# Several V-JEPA 2-AC sweep runs of one robot packed on one B300 (scripts/jobs/train_vjepa2_pack.sh); launched by
# cluster/sail/sweep_vjepa2.py. Restart-safe per run. Per-run W&B telemetry (one W&B run each).
name: pwm-train-vjepa2-pack

resources:
  infra: k8s/pantheon
  accelerators: B300:1
  cpus: 22
  memory: 250
  image_id: docker:nvcr.io/nvidia/pytorch:26.05-py3
  job_recovery: {max_restarts_on_errors: 3}

workdir: .

volumes:
  /persist: ${cluster_volume}

envs:
  PANTHEON_USER: ${cluster_user}
  ROBOT: ""
  DATASET: nominal
  RUNS: ""                       # space-separated sweep runs packed on this GPU
  EXPERIMENT_TAG: ""
  WANDB_RUN_ID: ""
  WANDB_RESUME: allow
  OMP_NUM_THREADS: "8"
  PWM_UV_CACHE_DIR: /tmp/pwm_uv_cache

secrets:
  - secrets:WANDB_API_KEY

setup: |
  bash cluster/sail/job_setup.sh

run: |
  bash scripts/jobs/train_vjepa2_pack.sh --robot "$ROBOT" --dataset "$DATASET" --runs "$RUNS"
  status=$?
  # Jobs on this cluster can stay RUNNING after the script ends if a child outlives it: end leftovers explicitly.
  pkill -9 -f "/tmp/pwm_env[s]/" 2>/dev/null
  echo "ALL DONE (status $status)"
  exit $status
