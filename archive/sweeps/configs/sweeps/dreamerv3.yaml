# DreamerV3 sweep (pwm/wm/dreamerv3/train.py --sweep_run <name>): named runs, overrides only, merged over
# configs/world_models.yaml `dreamerv3` (the baseline values). `base: <run>` builds on another run's overrides.
# Run names on the cluster: dv3-<robot>-<run>; every run is trained on every robot (nominal 5 h data).
#
# Selection (fixed before any run): val/openloop_mse64 = per-pixel MSE at 64 px of the 4.8 s open-loop prediction
# from 1 real context frame (the eval panel's protocol) on 128 fixed val episodes, seed 0. It picks the best checkpoint
# and stops a run (4 evaluations, 500 steps apart, without 0.2% improvement). Also reported per run: the base
# objective and its parts (image / success / continue NLL, KL) on 256 fixed val windows, native-resolution open-loop
# MSE / LPIPS and action sensitivity on 32 fixed val episodes. Results: <results_dir>/sweeps/dreamerv3/<robot>.md.
#
# Grid: one factor at a time from the baseline (a fractional design: 11 runs instead of the 4x2x2x3x3x2 = 288 full
# product). When a robot's grid is done, its best grid run (`best_grid`) and runner-up (`second_grid`) get
# seeds_per_run more seeds (group `seeds`), to put the grid differences next to seed noise. (A training-tricks phase
# was dropped on 2026-10-26; its results are in plans/literature_tricks.md.)
runs:
  # ---------------------------------------------------------------- grid
  baseline: {}                                         # s25m (27.9M), 64 px, sequence 64, lr 1e-4, KL default, batch 32
  size_s12m: {overrides: {size: s12m}}                 # 13.0M
  size_s50m: {overrides: {size: s50m}}                 # 55.6M
  size_s100m: {overrides: {size: s100m}}               # 105.5M
  res128: {overrides: {image_size: 128}}
  seq128: {overrides: {batch_length: 128}}
  lr3e-5: {overrides: {model_lr: 3.0e-5}}
  lr3e-4: {overrides: {model_lr: 3.0e-4}}
  kl_free0.1: {overrides: {overrides: {kl_free: 0.1}}}                      # free bits 1.0 -> 0.1 (almost off)
  kl_balance: {overrides: {overrides: {dyn_scale: 0.8, rep_scale: 0.2}}}    # DreamerV2-style balance (default 0.5 / 0.1)
  batch128: {overrides: {batch_size: 128}}

  # ---------------------------------------------------------------- seed replicates of the grid's two best runs
  # repointed per robot when its grid has finished (<storage_dir>/sweeps/dreamerv3/<robot>/best_grid.json,
  # pwm/wm/dreamerv3/sweep.py); the yaml base here is only the fallback before the choice exists.
  best_grid: {base: baseline}
  second_grid: {base: baseline}                        # the runner-up of the grid (best_grid.json ranking)

groups:
  seeds_per_run: [1, 2]          # extra seeds of the `seeds` runs (run name <run>-seed<N>)
  grid: [baseline, size_s12m, size_s50m, size_s100m, res128, seq128, lr3e-5, lr3e-4, kl_free0.1, kl_balance, batch128]
  seeds: [best_grid, second_grid]            # the extra seeds only (seed 0 is the grid run itself)
